name: Ferry Android 35 Manual Tools
on:
  push:
    branches: ["ci-android-v06-certifier"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ferry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble compact Android manual toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if [ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          LIBCPP=""
          for p in "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" "$ANDROID_HOME/build-tools/35.0.0/lib/libc++.so"; do [ -f "$p" ] && LIBCPP="$p" && break; done
          test -n "$LIBCPP"
          rm -rf /tmp/android-manual-kit
          mkdir -p /tmp/android-manual-kit/sdk/platforms/android-35 /tmp/android-manual-kit/sdk/build-tools/35.0.0/lib /tmp/android-manual-kit/sdk/build-tools/35.0.0/lib64 /tmp/android-manual-kit/deps
          cp "$ANDROID_HOME/platforms/android-35/android.jar" /tmp/android-manual-kit/sdk/platforms/android-35/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" /tmp/android-manual-kit/sdk/build-tools/35.0.0/
          cp "$ANDROID_HOME/build-tools/35.0.0/d8" /tmp/android-manual-kit/sdk/build-tools/35.0.0/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/android-manual-kit/sdk/build-tools/35.0.0/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/android-manual-kit/sdk/build-tools/35.0.0/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" /tmp/android-manual-kit/sdk/build-tools/35.0.0/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/android-manual-kit/sdk/build-tools/35.0.0/lib/
          cp "$LIBCPP" /tmp/android-manual-kit/sdk/build-tools/35.0.0/lib64/libc++.so
          cat > /tmp/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion><groupId>local</groupId><artifactId>manual-kit</artifactId><version>1</version>
            <dependencies>
              <dependency><groupId>com.squareup.okhttp3</groupId><artifactId>okhttp</artifactId><version>4.12.0</version></dependency>
              <dependency><groupId>junit</groupId><artifactId>junit</artifactId><version>4.13.2</version><scope>test</scope></dependency>
              <dependency><groupId>org.json</groupId><artifactId>json</artifactId><version>20240303</version><scope>test</scope></dependency>
            </dependencies>
          </project>
          POM
          mvn -q -f /tmp/pom.xml dependency:copy-dependencies -DincludeScope=test -DoutputDirectory=/tmp/android-manual-kit/deps
          test -f /tmp/android-manual-kit/deps/okhttp-4.12.0.jar
          test -f /tmp/android-manual-kit/deps/junit-4.13.2.jar
          find /tmp/android-manual-kit -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/android-manual-kit/MANIFEST.sha256
          printf 'ANDROID_PLATFORM=35\nANDROID_BUILD_TOOLS=35.0.0\nPIPELINE=AAPT2_LINK_JAVAC_D8_ZIPALIGN_APKSIGNER\n' > /tmp/android-manual-kit/KIT_INFO.txt
          du -sh /tmp/android-manual-kit
      - uses: actions/upload-artifact@v4
        with:
          name: android35-manual-tools-and-deps-libcpp
          path: /tmp/android-manual-kit
          if-no-files-found: error
          compression-level: 6
# trigger manual-kit libcpp
