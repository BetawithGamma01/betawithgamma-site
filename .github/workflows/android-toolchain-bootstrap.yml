name: Android Toolchain Bootstrap

on:
  push:
    branches:
      - ci/android-toolchain-bootstrap-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Resolve V0.8 dependency jars only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v080-deps
          cat >/tmp/v080-deps/settings.gradle.kts <<'EOF'
          rootProject.name = "v080-deps"
          EOF
          cat >/tmp/v080-deps/build.gradle.kts <<'EOF'
          plugins { java }
          repositories { mavenCentral() }
          val appRuntime by configurations.creating
          val testRuntime by configurations.creating
          dependencies {
              appRuntime("com.squareup.okhttp3:okhttp:4.12.0")
              testRuntime("junit:junit:4.13.2")
              testRuntime("org.json:json:20240303")
          }
          tasks.register<Copy>("copyDeps") {
              from(appRuntime)
              from(testRuntime)
              into(layout.buildDirectory.dir("deps"))
          }
          EOF
          gradle -p /tmp/v080-deps --no-daemon copyDeps

      - name: Assemble toolchain artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v080-android-toolchain
          mkdir -p "$OUT/platforms/android-35" "$OUT/deps"
          cp "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" "$OUT/platforms/android-35/android.jar"
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" "$OUT/build-tools-35.0.0"
          cp /tmp/v080-deps/build/deps/*.jar "$OUT/deps/"
          {
            echo 'JDK:'
            java -version 2>&1
            echo 'GRADLE:'
            gradle --version
            echo 'SDK:'
            sdkmanager --list_installed
          } > "$OUT/TOOLCHAIN_VERSIONS.txt"
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SHA256SUMS.txt"
          test -x "$OUT/build-tools-35.0.0/aapt2"
          test -x "$OUT/build-tools-35.0.0/d8"
          test -x "$OUT/build-tools-35.0.0/zipalign"
          test -x "$OUT/build-tools-35.0.0/apksigner"
          test -s "$OUT/platforms/android-35/android.jar"

      - name: Upload Android toolchain
        uses: actions/upload-artifact@v4
        with:
          name: v080-android-toolchain-linux
          retention-days: 1
          if-no-files-found: error
          path: /tmp/v080-android-toolchain/
