name: Android V085 Generic Toolchain Ferry

on:
  push:
    branches:
      - ci/android-toolchain-bootstrap-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install pinned public Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          test -s /tmp/gradle-8.9-bin.zip
      - name: Resolve AGP lint and V085 public dependencies with dummy source only
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/v085-dummy
          rm -rf "$D" && mkdir -p "$D/app/src/main/java/ferry" "$D/app/src/test/java/ferry"
          cat >"$D/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "v085-ferry"
          include(":app")
          EOF
          cat >"$D/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF
          cat >"$D/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "ferry.generic"
            compileSdk = 35
            buildToolsVersion = "35.0.0"
            defaultConfig { applicationId = "ferry.generic"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1" }
            buildTypes { release { isMinifyEnabled = false } }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
            testImplementation("junit:junit:4.13.2")
            testImplementation("org.json:json:20240303")
          }
          EOF
          cat >"$D/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme" /></manifest>
          EOF
          mkdir -p "$D/app/src/main/res/values"
          cat >"$D/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
          EOF
          cat >"$D/app/src/main/java/ferry/Dummy.java" <<'EOF'
          package ferry; public final class Dummy { public static int x(){ return 1; } }
          EOF
          cat >"$D/app/src/test/java/ferry/DummyTest.java" <<'EOF'
          package ferry; import org.junit.Test; import static org.junit.Assert.*; public class DummyTest { @Test public void ok(){ assertEquals(1,Dummy.x()); } }
          EOF
          gradle -p "$D" --no-daemon --stacktrace :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.lint/lint-gradle/31.7.3"
      - name: Package public-only offline ferry
        shell: bash
        run: |
          set -euo pipefail
          O=/tmp/v085-ferry
          rm -rf "$O" && mkdir -p "$O"
          cp /tmp/gradle-8.9-bin.zip "$O/"
          mkdir -p /tmp/android-sdk-min
          cp -a "$ANDROID_SDK_ROOT/platforms" /tmp/android-sdk-min/
          cp -a "$ANDROID_SDK_ROOT/build-tools" /tmp/android-sdk-min/
          cp -a "$ANDROID_SDK_ROOT/platform-tools" /tmp/android-sdk-min/
          [ ! -d "$ANDROID_SDK_ROOT/licenses" ] || cp -a "$ANDROID_SDK_ROOT/licenses" /tmp/android-sdk-min/
          tar -C /tmp -czf "$O/android-sdk35-buildtools35.tar.gz" android-sdk-min
          tar -C "$HOME/.gradle" -czf "$O/gradle-public-cache.tar.gz" caches
          {
            echo 'GRADLE=8.9'
            echo 'AGP=8.7.3'
            echo 'LINT_GRADLE=31.7.3'
            echo 'ANDROID_PLATFORM=35'
            echo 'ANDROID_BUILD_TOOLS=35.0.0'
            java -version 2>&1
            gradle --version
          } > "$O/TOOLCHAIN_VERSIONS.txt"
          (cd "$O" && sha256sum gradle-8.9-bin.zip android-sdk35-buildtools35.tar.gz gradle-public-cache.tar.gz TOOLCHAIN_VERSIONS.txt) > "$O/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: v085-generic-android-offline-toolchain
          retention-days: 1
          if-no-files-found: error
          path: /tmp/v085-ferry/
