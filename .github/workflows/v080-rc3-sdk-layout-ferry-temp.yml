name: V080 RC3 SDK Layout Ferry Temp

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v080-rc3-sdk-layout-ferry-temp.yml']

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install exact Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Package AGP-required SDK layout
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v080-rc3-sdk-layout
          mkdir -p "$OUT/platforms" "$OUT/build-tools"
          cp -a "$ANDROID_SDK_ROOT/platforms/android-35" "$OUT/platforms/"
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" "$OUT/build-tools/"
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SHA256SUMS.txt"
          du -sh "$OUT" | tee "$OUT/SIZE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: v080-rc3-sdk-layout
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: /tmp/v080-rc3-sdk-layout/
