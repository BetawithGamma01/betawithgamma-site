name: Temporary Android Toolchain Ferry
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ferry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package exact local Android build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle-8.10.2-bin.zip
          test -s /tmp/gradle-8.10.2-bin.zip
          if [ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          rm -rf /tmp/android-sdk-min && mkdir -p /tmp/android-sdk-min
          cp -a "$ANDROID_HOME/platforms" /tmp/android-sdk-min/
          cp -a "$ANDROID_HOME/build-tools" /tmp/android-sdk-min/
          cp -a "$ANDROID_HOME/platform-tools" /tmp/android-sdk-min/
          [ ! -d "$ANDROID_HOME/licenses" ] || cp -a "$ANDROID_HOME/licenses" /tmp/android-sdk-min/
          tar -C /tmp -czf /tmp/android-sdk35-buildtools35.tar.gz android-sdk-min
          sha256sum /tmp/gradle-8.10.2-bin.zip /tmp/android-sdk35-buildtools35.tar.gz > /tmp/toolchain.sha256
          printf 'GRADLE=8.10.2\nANDROID_PLATFORM=35\nANDROID_BUILD_TOOLS=35.0.0\n' > /tmp/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-local-toolchain-ferry
          path: |
            /tmp/gradle-8.10.2-bin.zip
            /tmp/android-sdk35-buildtools35.tar.gz
            /tmp/toolchain.sha256
            /tmp/toolchain.txt
          if-no-files-found: error
