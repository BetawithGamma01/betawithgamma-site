name: Build Microstructure Android V0
on:
  push:
    branches: ["ci-android-microstructure-v0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rehydrate source
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d ci/microstructure-evidence-v0-source.tar.gz.b64 > /tmp/source.tar.gz
          mkdir -p /tmp/src
          tar -xzf /tmp/source.tar.gz -C /tmp/src
          test -f /tmp/src/microstructure-evidence-android-v0/settings.gradle.kts

      - name: Bootstrap Gradle and Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          test -x /tmp/gradle-8.10.2/bin/gradle
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          if [ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Test and build APK
        shell: bash
        run: |
          set +e
          cd /tmp/src/microstructure-evidence-android-v0
          /tmp/gradle-8.10.2/bin/gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug > /tmp/android-build.log 2>&1
          code=$?
          cat /tmp/android-build.log
          echo "$code" > /tmp/android-build.exit
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microstructure-evidence-v0-diagnostics
          path: |
            /tmp/android-build.log
            /tmp/android-build.exit
            /tmp/src/microstructure-evidence-android-v0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Enforce build success
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat /tmp/android-build.exit)" = "0"
          test -f /tmp/src/microstructure-evidence-android-v0/app/build/outputs/apk/debug/app-debug.apk
